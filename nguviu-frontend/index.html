<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="NGUVIU GIRLS - Excellence in Education. A leading girls' school offering quality education with comprehensive curriculum, dedicated staff, and excellent facilities." />
    <meta name="keywords" content="NGUVIU GIRLS, girls school, education, curriculum, admissions, school performance, student portal, academic excellence" />
    <meta name="author" content="NGUVIU GIRLS School" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:title" content="NGUVIU GIRLS - Excellence in Education" />
    <meta property="og:description" content="A leading girls' school offering quality education with comprehensive curriculum, dedicated staff, and excellent facilities." />
    <meta property="og:image" content="https://your-domain.com/header/logo.PNG" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://your-domain.com/" />
    <meta name="twitter:title" content="NGUVIU GIRLS - Excellence in Education" />
    <meta name="twitter:description" content="A leading girls' school offering quality education with comprehensive curriculum, dedicated staff, and excellent facilities." />
    <meta name="twitter:image" content="https://your-domain.com/header/logo.PNG" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://your-domain.com/" />
    
    <title>NGUVIU GIRLS - Excellence in Education</title>
    
    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://nguviu-school.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://nguviu-school.onrender.com" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/header/favicon.jpeg" />
    
    <!-- Structured Data (Schema.org) for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "NGUVIU GIRLS School",
      "description": "Excellence in Education - A leading girls' school",
      "url": "https://your-domain.com",
      "logo": "https://your-domain.com/header/logo.PNG"
    }
    </script>
    
    <!-- Preload critical assets for sub-500ms load -->
    <link rel="modulepreload" href="/src/main.jsx" />
    <link rel="preload" href="/header/logo.PNG" as="image" />
    
    <!-- Font optimization -->
    <style>
      /* Font display swap for faster text rendering */
      @font-face {
        font-family: system;
        font-style: normal;
        font-weight: 300;
        font-display: swap;
      }
    </style>
    
    <!-- Critical CSS inlined for faster first paint -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      
      /* Initial Loader Styles - matches Loader component */
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #481010ff;
        z-index: 9999;
      }
      
      .initial-loader {
        position: relative;
        width: 140px;
        height: 140px;
      }
      
      .initial-loader-ring {
        position: absolute;
        inset: 0;
        border: 4px solid rgba(255,255,255,0.1);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      
      .initial-loader-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70%;
        height: 70%;
        object-fit: contain;
        border-radius: 50%;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Optimized Loading state matching Loader component -->
      <div class="app-loading">
        <div class="initial-loader">
          <div class="initial-loader-ring"></div>
          <img src="/header/logo.PNG" alt="NGUVIU logo" class="initial-loader-logo" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
